# OpenCircle settings. Invalid values fall back to defaults.
# API keys are never stored here (OS keyring only).

version = 12
theme = "system"
glass_effect = true
shortcut = "Ctrl+Shift+Space"

[appearance]
dark = "sapphire"
light = "daylight"
logo = "theme"
hidden_previews = []

[general]
default_action = "lens"
save_folder = ""
autostart = true

[bar]
anchor = "bottom"

[selection]
style = "snap"
text_reader = "auto"

[look]
theme = "sapphire_glow"

[look.custom]
palette = "spectrum"
colours = [
    "#8f80ff",
    "#4fc9e0",
]
glow = 100
dim = 12
brackets = "white"
bracket_style = "corners"
bar = "glass"

[look.custom.overlay]
style = "glow"
thickness = 6

[look.custom.live]
style = "glow"
thickness = 6

[look.custom.snip]
style = "thin"
thickness = 3

[editor]
line_assist = true

[ai]
provider = "browser"
base_url = ""
model = "claude-sonnet-5-5"

[translate]
source = "auto"
target = "ar"
engine = "offline"
live_interval_ms = 1500

[snip]
after = "editor"
max_edge = 0
format = "png"
save_original = false
cursor = false
history = false
delay = 0

[[quick_actions]]
action = "translate"
shortcut = "Alt+Shift+T"
target = "full_screen"

[[quick_actions]]
action = "translate"
shortcut = "Alt+Shift+L"
target = "full_screen"
live = true

[[quick_actions]]
action = "ai_explain"
shortcut = "Ctrl+Shift+E"
target = "circle"

[[quick_actions]]
action = "copy_text"
shortcut = "Ctrl+Shift+X"
target = "circle"

[[quick_actions]]
action = "lens"
shortcut = ""
target = "circle"

[[quick_actions]]
action = "snip"
shortcut = "Alt+A"
target = "circle"

[[quick_actions]]
action = "song_search"
shortcut = ""
target = "full_screen"

[song]
source = "system"
history = false

[update]

[labs]
song = false
pins = false
live = false
