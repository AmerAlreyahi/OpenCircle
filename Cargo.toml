[package]
name = "opencircle"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Circle anything on screen to search, read, translate or ask about it"

[dependencies]
# ponytail: tiny-skia (CPU) only: wgpu cost ~110 MB idle on WSLg (owner target
# < 40 MB idle). Re-measure wgpu on Windows (D3D12) before adding it back.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia", "x11", "wayland", "thread-pool", "canvas", "image-without-codecs",
    "linux-theme-detection", # System theme follows the OS (Linux; Windows is built in)
    "advanced", # font system + headless renderer for the editor (no extra code)
] }
arboard = "3.7"
base64 = "0.22"
dirs = "7"
# same version iced already builds: no second text stack in the binary
cosmic-text = "0.15"
global-hotkey = "0.9"
interprocess = "2.4"
# OS keyring for AI keys (Windows Credential Manager / Linux Secret Service over
# pure-Rust zbus: no libdbus needed). Never a file fallback.
keyring = "4.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Save dialog. xdg-portal on Linux (the tray owns the GTK thread, so no gtk3 backend).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tray-icon = "0.26"
# OCR (src/ocr): PP-OCRv5 on ONNX Runtime. Nothing of ORT is linked: its shared
# library is downloaded with the models on first use and loaded at runtime
# (ort `load-dynamic`), only inside the short-lived `ocr-worker` process.
oar-ocr = { version = "0.10.1", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# jpeg: Save as JPEG (already built for arboard / iced: no new crate).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Same version iced_tiny_skia already builds: the editor flattens annotations with it.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
hmac-sha256 = "1.1"
flate2 = "1"
# Blocking HTTP for the AI clients: rustls (ring), no gzip, no async runtime.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
rqrr = { version = "0.11.0", default-features = false }
minisign-verify = "0.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Song search's audio (src/music): the PulseAudio protocol in pure Rust (no libpulse;
# PipeWire's pulse server speaks it). Opened only while listening.
pulseaudio = "0.3"
# xfixes + shape: the live layer's empty input shape (click-through)
xcb = { version = "1.7", features = ["randr", "xtest", "xfixes", "shape"] }

[target.'cfg(windows)'.dependencies]
# Song search's audio (src/music): WASAPI loopback / microphone, only while listening.
cpal = { version = "0.18", default-features = false }
widestring = "1"
xcap = "0.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "OpenCircle"
identifier = "com.opencircle.app"
category = "Utility"
authors = ["OpenCircle contributors"]
homepage = "https://github.com/AmerAlreyahi/OpenCircle"
before-packaging-command = "cargo build --release"
binaries = [{ path = "opencircle", main = true }]
icons = [
    "assets/icons/opencircle.ico",
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
]
# cargo-packager has no rpm format: the .rpm comes from cargo-generate-rpm (below).
formats = ["nsis", "wix", "appimage", "deb"]
# The installers' licence/notice page (RTF is what WiX needs; NSIS takes it too).
license-file = "assets/installer/license.rtf"

# Windows MSI: cargo-packager's template is already WixUI_InstallDir (pick the folder),
# with a "Launch OpenCircle" checkbox (checked) on the finish page, a Start menu
# shortcut, and a stable UpgradeCode derived from the identifier (upgrades replace).
# Ours: the artwork (493x58 banner, 493x312 welcome/finish image) and main.wxs, the
# default template minus the desktop shortcut and the "Uninstall" shortcut (owner).
[package.metadata.packager.wix]
template = "assets/installer/main.wxs"
banner-path = "assets/installer/banner.bmp"
dialog-image-path = "assets/installer/dialog.bmp"

# NSIS (.exe): sidebar on welcome/finish, header on the inner pages.
[package.metadata.packager.nsis]
sidebar-image = "assets/installer/nsis-sidebar.bmp"
header-image = "assets/installer/nsis-header.bmp"

# Linux runtime libraries. `ldd target/release/opencircle` links gtk3, glib and
# libxcb; winit, iced and tray-icon dlopen the rest (X11, xkbcommon, wayland,
# appindicator), so ldd alone never shows them. release.yml prints both lists.
[package.metadata.packager.deb]
package_name = "opencircle"
depends = [
    "libgtk-3-0",
    "libayatana-appindicator3-1",
    "libxcb1",
    "libx11-6",
    "libx11-xcb1",
    "libxcursor1",
    "libxi6",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "xdg-desktop-portal",
]
# The app id is com.opencircle.app (GNOME's portals need the desktop file named after
# it). cargo-packager names its desktop file and icons after the binary instead, so
# it gets our entry as the template, and release.yml renames the .deb's files to
# com.opencircle.app.desktop / com.opencircle.app.png.
desktop-template = "packaging/com.opencircle.app.desktop"

# The AppImage's entry (same template) names Icon=com.opencircle.app: ship that icon.
# A raw AppImage writes its own ~/.local/share/applications/com.opencircle.app.desktop
# on first start under Wayland (capture/portal.rs).
[package.metadata.packager.appimage]
files = { "assets/icons/256x256.png" = "usr/share/icons/hicolor/256x256/apps/com.opencircle.app.png" }

# .rpm: `cargo generate-rpm` after `cargo build --release`. Same libraries, Fedora names.
[package.metadata.generate-rpm]
auto-req = "disabled"
assets = [
    { source = "target/release/opencircle", dest = "/usr/bin/opencircle", mode = "755" },
    { source = "packaging/com.opencircle.app.desktop", dest = "/usr/share/applications/com.opencircle.app.desktop", mode = "644" },
    { source = "assets/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.opencircle.app.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/opencircle/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
gtk3 = "*"
libayatana-appindicator-gtk3 = "*"
libxcb = "*"
libX11 = "*"
libX11-xcb = "*"
libXcursor = "*"
libXi = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"
xdg-desktop-portal = "*"

[dev-dependencies]
# Headless renders of the UI screens in tests (the versions iced already builds).
iced = { version = "0.14", default-features = false, features = ["advanced"] }
iced_runtime = "0.14"
# The window compositor's damage (frame-time tests): the version iced already builds.
iced_tiny_skia = "0.14"
qrcode = { version = "0.14.1", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
