[package]
name = "opencircle-mt-gpu"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "OpenCircle's GPU translation helper (llama.cpp, Vulkan); a separate exe so opencircle.exe never links llama.cpp"
publish = false

# Own workspace root: the main crate's gate (fmt, clippy, test) never builds llama.cpp.
[workspace]

[features]
# CI builds with --features vulkan; a plain build is the CPU backend (local proof, no GPU).
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
