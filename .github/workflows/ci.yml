# Gate for every push and PR: format, lint (warnings = errors), tests, audit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # build any branch for VM testing without opening a PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Nothing to check until the Rust crate lands on main.
      - id: crate
        shell: bash
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Linux build deps
        if: steps.crate.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgtk-3-dev libxdo-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.crate.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.crate.outputs.present == 'true'

      - if: steps.crate.outputs.present == 'true'
        run: cargo fmt --check
      - if: steps.crate.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings
      # Feature `sheet`: the results card's helper binary (release builds have it).
      - if: steps.crate.outputs.present == 'true'
        run: cargo clippy --all-targets --features sheet -- -D warnings
      - if: steps.crate.outputs.present == 'true'
        run: cargo test

      # Ready-to-run builds for manual testing (no Rust needed on the test PC):
      # the app and the results card's helper, side by side.
      - if: steps.crate.outputs.present == 'true'
        run: cargo build --release --features sheet
      - if: steps.crate.outputs.present == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: opencircle-windows-exe
          path: |
            target/release/opencircle.exe
            target/release/opencircle-sheet.exe
          retention-days: 7
      - if: steps.crate.outputs.present == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: opencircle-linux-bin
          path: |
            target/release/opencircle
            target/release/opencircle-sheet
          retention-days: 7

  audit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write   # audit-check posts its result as a check run
    steps:
      - uses: actions/checkout@v4
      - id: crate
        run: echo "present=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rustsec/audit-check@v2
        if: steps.crate.outputs.present == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
