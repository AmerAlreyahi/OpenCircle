# Gate for every push and PR: format, lint (warnings = errors), tests, audit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # build any branch for VM testing without opening a PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Nothing to check until the Rust crate lands on main.
      - id: crate
        shell: bash
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Linux build deps
        if: steps.crate.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgtk-3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.crate.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.crate.outputs.present == 'true'

      - if: steps.crate.outputs.present == 'true'
        run: cargo fmt --check
      - if: steps.crate.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings
      - if: steps.crate.outputs.present == 'true'
        run: cargo test

      # Frame-time budget (#59): the opening's work and damage area, in release
      # (debug is ~35x slower); +~3 min cold, less with the cache.
      - if: steps.crate.outputs.present == 'true' && runner.os == 'Linux'
        run: cargo test --release the_opening_stays_within_its_frame_budget -- --nocapture

      # OCR latency budget (#59): on Windows `cargo test` above reads the fixture with
      # the real Windows OCR (windows_ocr_reads_the_fixture: text + under 1.5 s).
      # PP-OCR needs downloaded models and CI downloads none: nothing to time here.
      - if: steps.crate.outputs.present == 'true' && runner.os == 'Linux'
        run: echo "PP-OCR latency not measured in CI - the models are not available (no downloads in CI)"

      # Ready-to-run builds for manual testing (no Rust needed on the test PC):
      # the app, one file on each OS.
      - if: steps.crate.outputs.present == 'true'
        run: cargo build --release
      - if: steps.crate.outputs.present == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: opencircle-windows-exe
          path: |
            target/release/opencircle.exe
          retention-days: 7
      - if: steps.crate.outputs.present == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: opencircle-linux-bin
          path: |
            target/release/opencircle
          retention-days: 7

  # Installer smoke test (#59): the setup exe (the one Windows installer; it carries
  # the MSI) installs silently, runs, uninstalls silently and leaves nothing. Not on
  # pull requests: it builds the release twice and packages (about 10 min), so it
  # runs on main and on demand (workflow_dispatch, any branch).
  installer:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      CARGO_PACKAGER_VERSION: 0.11.8   # as release.yml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --version "$env:CARGO_PACKAGER_VERSION" --locked
      - run: cargo packager --release --formats wix --out-dir dist
      - name: The setup exe carries the MSI (as release.yml builds it)
        shell: bash
        run: |
          OPENCIRCLE_SETUP_MSI="$(ls dist/*.msi)" cargo build --release
          msi=$(stat -c %s dist/*.msi)
          setup=$(stat -c %s target/release/opencircle.exe)
          echo "msi $msi, setup $setup"
          [ "$setup" -gt "$msi" ] || { echo "::error::the setup does not carry the MSI"; exit 1; }
      - name: Install, run, uninstall with the setup exe, silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $setup = (Resolve-Path target\release\opencircle.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'oc-install'
          $p = Start-Process $setup -Wait -PassThru -ArgumentList "/quiet /norestart /dir=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $exe = Join-Path $dir 'opencircle.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $dir -Recurse; throw "no $exe" }
          $said = (& $exe --version | Out-String).Trim()
          "installed exe says: $said"
          if ($said -ne $version) { throw "version '$said' is not '$version'" }
          $p = Start-Process $setup -Wait -PassThru -ArgumentList "/uninstall /quiet"
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          $left = if (Test-Path $dir) { Get-ChildItem $dir -Recurse -Force } else { @() }
          if ($left) { $left | Format-Table FullName; throw "the uninstall left files behind" }

  audit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write   # audit-check posts its result as a check run
    steps:
      - uses: actions/checkout@v4
      - id: crate
        run: echo "present=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rustsec/audit-check@v2
        if: steps.crate.outputs.present == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
