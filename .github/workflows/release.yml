# On tag v*: build Windows + Linux installers, add SHA256SUMS, create a DRAFT release.
# The owner reviews and publishes the draft (owner rule: approve every release).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # NSIS .exe + .msi
            formats: nsis,wix
          - os: ubuntu-22.04     # .AppImage + .deb + .rpm (22.04 = widest glibc reach)
            formats: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgtk-3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked

      - name: Build and package
        env:
          FORMATS: ${{ matrix.formats }}
        run: cargo packager --release --formats "$FORMATS" --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums + draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --draft --title "OpenCircle $TAG" --notes "Release notes are written before publishing."
