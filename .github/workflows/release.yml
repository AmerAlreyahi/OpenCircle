# Release build. Two ways in:
#   * push of a tag `v*`      -> build everything, then create a DRAFT release
#     (a tag `vX.Y.Z-beta.N` -> a DRAFT PRE-release; stable users never get it).
#   * manual "Run workflow"   -> dry run: build everything, upload it as workflow
#     artifacts, create NO release (not even with dry_run unticked: only a tag
#     push can create the draft).
# The workflow never publishes. The owner reviews the draft and publishes it
# (owner rule: approve every release). Binaries are unsigned (owner rule), but
# SHA256SUMS.txt is signed with minisign (SHA256SUMS.txt.minisig): the app's
# auto-update installs nothing without that signature. The private key is the
# secret MINISIGN_KEY of the `release` environment (an unencrypted minisign secret
# key file), used only by the `sign` job on a tag push; its public key is src/update/verify.rs
# RELEASE_PUBLIC_KEY, and the job checks the two match. A tag push without the
# secret fails; a manual dry run never touches the key and skips signing.
#
# The version comes from the tag (`v1.2.3` -> 1.2.3) and is stamped into Cargo.toml
# on the runner only; Cargo.toml stays at 0.0.0 in git. Every action is pinned to
# a commit SHA; the tools are pinned to versions.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and upload artifacts, never a release)
        type: boolean
        default: true
      version:
        description: Version to stamp in a manual run (X.Y.Z; a tag push uses the tag)
        type: string
        default: 0.0.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PACKAGER_VERSION: 0.11.8
  CARGO_GENERATE_RPM_VERSION: 0.21.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # setup .exe + .msi + portable .exe
            artifact: build-windows
          - os: ubuntu-22.04     # .AppImage + .deb + .rpm (22.04 = widest glibc reach)
            artifact: build-linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp the version from the tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          # A beta tag (vX.Y.Z-beta.N) builds as X.Y.Z: the MSI version must be numeric.
          # The draft below is marked a pre-release, which the updater never offers.
          version="${version%-beta.*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$version' is not X.Y.Z (tag vX.Y.Z or vX.Y.Z-beta.N)"; exit 1
          fi
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          grep -qx "version = \"$version\"" Cargo.toml

      - name: Refresh the About page's developer card (public GitHub profile)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/refresh-about.sh

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install packagers
        shell: bash
        run: |
          cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
          if [ "$RUNNER_OS" = Linux ]; then
            cargo install cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION" --locked
          fi

      # cargo-packager runs `cargo build --release` itself (before-packaging-command).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cargo packager --release --formats wix --out-dir dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # The .deb's desktop file and icons get the app id's name (GNOME's portals
        # look up com.opencircle.app.desktop); the .rpm lists them so in Cargo.toml.
        run: |
          cargo packager --release --formats deb,appimage --out-dir dist
          packaging/deb-app-id.sh dist/*.deb
          cargo generate-rpm -o dist/

      # The Windows names (#55): OpenCircle-<ver>-x64.msi, OpenCircle-<ver>-x64-portable.exe
      # (the auto-update replaces an installed exe with this plain copy, src/update)
      # and, for ONE release only, the portable exe under its old name
      # OpenCircle_<ver>_x64-portable.exe: 0.1.0's updater looks for that one.
      - name: Name the MSI, portable exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          msi=$(ls dist/*.msi)
          [ "$(echo "$msi" | wc -l)" = 1 ] || { echo "::error::expected one MSI: $msi"; exit 1; }
          mv "$msi" "dist/OpenCircle-${version}-x64.msi"
          cp target/release/opencircle.exe "dist/OpenCircle-${version}-x64-portable.exe"
          cp target/release/opencircle.exe "dist/OpenCircle_${version}_x64-portable.exe"
          ls -la dist

      # The exe must be GUI-subsystem (2) and carry the icon + version info.
      - name: Check the Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($exe in "target\release\opencircle.exe") {
            $b = [IO.File]::ReadAllBytes($exe)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $subsystem = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
            "$exe subsystem = $subsystem (2 = GUI, 3 = console)"
            if ($subsystem -ne 2) { throw "$exe is not GUI-subsystem" }
          }
          $exe = "target\release\opencircle.exe"
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List FileVersion, ProductVersion, ProductName, FileDescription, OriginalFilename
          if (-not $info.FileVersion.StartsWith((Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value)) { throw "version info does not match Cargo.toml" }

      # Our setup (src/setup): this program again with the MSI inside. Built after
      # the checks above, since it overwrites target/release/opencircle.exe.
      - name: Setup exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          OPENCIRCLE_SETUP_MSI="dist/OpenCircle-${version}-x64.msi" cargo build --release
          cp target/release/opencircle.exe "dist/OpenCircle-Setup-${version}-x64.exe"
          msi=$(stat -c %s "dist/OpenCircle-${version}-x64.msi")
          setup=$(stat -c %s "dist/OpenCircle-Setup-${version}-x64.exe")
          [ "$setup" -gt "$msi" ] || { echo "::error::the setup does not carry the MSI"; exit 1; }
          ls -la dist

      # Prove the runtime dependencies. ldd lists what is linked (and fails on a
      # missing library); the libraries gtk/winit/tray-icon dlopen are not linked,
      # so they are listed from the binary's strings and must be in the package's
      # depends (Cargo.toml [package.metadata.packager.deb]).
      - name: Check the Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          bin=target/release/opencircle
          echo "== ldd =="; ldd "$bin" | tee ldd.txt
          if grep 'not found' ldd.txt; then exit 1; fi
          echo "== direct NEEDED libraries and their packages =="
          for lib in $(readelf -d "$bin" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
            path=$(ldconfig -p | awk -v l="$lib" '$1==l {print $NF; exit}')
            echo "$lib -> $(dpkg -S "$(readlink -f "${path:-$lib}")" 2>/dev/null | head -1 | cut -d: -f1)"
          done
          echo "== dlopened libraries =="
          strings "$bin" | grep -oE 'lib[A-Za-z0-9_+-]+\.so\.[0-9]+' | sort -u
          # No web view anywhere (N-02): nothing links or ships WebKitGTK.
          if grep -qE 'webkit|javascriptcore|soup' ldd.txt; then echo "::error::opencircle links WebKitGTK"; exit 1; fi
          echo "== deb =="; dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb | grep -E 'applications/|apps/|bin/'
          if dpkg-deb -c dist/*.deb | grep -q 'opencircle-sheet'; then echo "::error::the .deb ships the old results-card helper"; exit 1; fi
          if dpkg-deb -I dist/*.deb | grep -qi webkit; then echo "::error::the .deb asks for WebKitGTK"; exit 1; fi
          if command -v rpm >/dev/null; then
            echo "== rpm =="; rpm -qlp dist/*.rpm | grep -x /usr/share/applications/com.opencircle.app.desktop
            if rpm -qlp dist/*.rpm | grep -q opencircle-sheet; then echo "::error::the .rpm ships the old helper"; exit 1; fi
          fi
          echo "== AppImage =="
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          ls -la "$RUNNER_TEMP/squashfs-root/usr/bin"
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/opencircle"
          if find "$RUNNER_TEMP/squashfs-root" -name 'libwebkit2gtk*' | grep -q .; then echo "::error::the AppImage bundles WebKitGTK"; exit 1; fi
          echo "bundled libraries: $(find "$RUNNER_TEMP/squashfs-root/usr/lib" -name '*.so*' | wc -l)"
          find "$RUNNER_TEMP/squashfs-root/usr/lib" -name '*.so*' -printf '%f\n' | sort | head -100

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  checksums:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/update/verify.rs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Signing is tag-only
        if: github.ref_type != 'tag'
        run: echo "::notice::dry run - SHA256SUMS.txt is not signed (the signing key is only used for tag pushes)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The only job that sees the signing key: tag pushes only, behind the `release`
  # environment (tags v* only, holds MINISIGN_KEY, no password). rsign2 is
  # minisign-compatible (minisign is not in ubuntu-22.04's apt). The trusted
  # comment `OpenCircle v<version>` is checked again by the app, so an old signed
  # release cannot be replayed as a new one.
  sign:
    needs: checksums
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/update/verify.rs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Sign SHA256SUMS.txt and verify with the app's public key
        working-directory: dist
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          RSIGN_VERSION: 0.6.7
        run: |
          pub=$(sed -n 's/^pub const RELEASE_PUBLIC_KEY: &str = "\(.*\)";/\1/p' ../src/update/verify.rs)
          if [ -z "$pub" ]; then
            echo "::error::src/update/verify.rs RELEASE_PUBLIC_KEY is empty: the app would refuse this release"; exit 1
          fi
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::error::secret MINISIGN_KEY is not set: an unsigned release cannot auto-update"; exit 1
          fi
          cargo install rsign2 --version "$RSIGN_VERSION" --locked
          key="$RUNNER_TEMP/minisign.key"
          (umask 077; printf '%s\n' "$MINISIGN_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          comment="OpenCircle v${GITHUB_REF_NAME#v}"
          rsign sign -s "$key" -W -t "$comment" -x SHA256SUMS.txt.minisig SHA256SUMS.txt
          rsign verify -P "$pub" -x SHA256SUMS.txt.minisig SHA256SUMS.txt 2>&1 | tee verify.out
          grep -qx "Trusted comment: $comment" verify.out
          rm verify.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signature
          path: dist/SHA256SUMS.txt.minisig
          if-no-files-found: error
          retention-days: 14

  # The only job that can write to the repository, and only for a tag push.
  draft:
    needs: [checksums, sign]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create the DRAFT release (never published here)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; case "$TAG" in *-beta.*) pre="--prerelease";; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft $pre \
            --title "OpenCircle $TAG" --notes "Release notes are written before publishing."
